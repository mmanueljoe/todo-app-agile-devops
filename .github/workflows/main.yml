name: CI - Test and Build Todo Dashboard

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-and-build:
    name: Test and Build (Node 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests with coverage
        run: |
          echo "Running unit tests with coverage..."
          yarn test --run --coverage
        env:
          CI: true

      - name: Build project
        run: |
          echo "Building React Todo Dashboard..."
          yarn run build
        env:
          CI: true

      - name: Summarize results (success)
        if: success()
        run: |
          echo "✅ All CI steps completed successfully."
          echo "✅ Tests passed (see logs above for coverage details)."
          echo "✅ Build succeeded."

      - name: Summarize results (failure)
        if: failure()
        run: |
          echo "❌ CI pipeline failed."
          echo "Check the test and build logs above for details."

